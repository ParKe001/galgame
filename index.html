<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>星见丘</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Hiragino Mincho ProN","SimSun",serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
img{-webkit-user-drag:none}
button{font-family:inherit}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:80}
.screen.on{display:flex}
#titleScreen,#nameScreen{background:#000}
#startBtn{font-size:clamp(42px,12vw,92px);font-weight:400;letter-spacing:.5em;padding:.2em .1em .2em .6em;cursor:pointer;color:#fff;text-shadow:0 0 30px rgba(255,255,255,.35);animation:breathe 3.4s ease-in-out infinite;transition:opacity .4s}
#startBtn:active{opacity:.6}
@keyframes breathe{0%,100%{opacity:.78}50%{opacity:1}}
.tip{margin-top:38px;font-size:11px;letter-spacing:.7em;color:rgba(255,255,255,.4);animation:blink 2.6s ease-in-out infinite;text-indent:.7em}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:.7}}
#continueBtn{margin-top:34px;font-size:12px;letter-spacing:.4em;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:0;padding:12px 34px;background:rgba(255,255,255,.06);cursor:pointer;transition:.35s}
#continueBtn:active{background:rgba(255,255,255,.2)}
.panel{width:min(430px,84vw);text-align:center}
.panel h2{margin:0 0 14px;font-size:clamp(17px,4.6vw,21px);font-weight:400;letter-spacing:.45em;color:#fff;text-indent:.45em}
.panel p{margin:0 0 44px;font-size:11px;color:rgba(255,255,255,.42);letter-spacing:.28em;text-indent:.28em}
#nameInput{width:100%;padding:16px 8px;font-size:19px;text-align:center;letter-spacing:.3em;color:#fff;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.35);border-radius:0;outline:none;font-family:inherit;transition:border-color .4s}
#nameInput::placeholder{color:rgba(255,255,255,.22)}
#nameInput:focus{border-bottom-color:#fff}
#okBtn{margin-top:46px;width:100%;padding:15px;font-size:13px;letter-spacing:.5em;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.4);border-radius:0;cursor:pointer;transition:.35s;text-indent:.5em}
#okBtn:active{background:rgba(255,255,255,.22)}
#gameScreen{position:fixed;inset:0;display:none;z-index:60}
#gameScreen.on{display:block}
#bg{position:absolute;inset:0;background:#0b1020 url("images/bg.jpg") center/cover no-repeat;transition:none}
.bg-cherry{background-image:url("images/bg_cherry.jpg")!important}
.bg-corridor{background-image:url("images/bg_corridor.jpg")!important}
.bg-sunset{background-image:url("images/bg_sunset.jpg")!important}
.bg-library{background-image:url("images/bg_library.jpg")!important}
.bg-rain{background-image:url("images/bg_rain.jpg")!important}
.bg-star{background-image:url("images/bg_star.jpg")!important}
.bg-night{background-image:url("images/bg_night.jpg")!important}
.bg-street{background-image:url("images/bg_street.jpg")!important}
.bg-sea{background-image:url("images/bg_sea.jpg")!important}
.bg-snow{background-image:url("images/bg_snow.jpg")!important}
.bg-room{background-image:url("images/bg_room.jpg")!important}
.bg-fireworks{background-image:url("images/bg_fireworks.jpg")!important}
.bg-garden{background-image:url("images/bg_garden.jpg")!important}
.bg-morning{background-image:url("images/bg_morning.jpg")!important}
#bgFx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .8s}
#bgFx.rain{opacity:1;background-image:repeating-linear-gradient(102deg,rgba(255,255,255,.16) 0 1px,transparent 1px 26px);background-size:200px 200px;animation:rainMove .55s linear infinite}
@keyframes rainMove{from{background-position:0 0}to{background-position:-70px 400px}}
#bgFx.stars{opacity:1;animation:twk 3.6s ease-in-out infinite;background-image:radial-gradient(1.6px 1.6px at 12% 18%,#fff,transparent),radial-gradient(1.4px 1.4px at 30% 9%,#fff,transparent),radial-gradient(1.8px 1.8px at 52% 22%,#fff,transparent),radial-gradient(1.3px 1.3px at 71% 13%,#fff,transparent),radial-gradient(1.7px 1.7px at 86% 27%,#fff,transparent),radial-gradient(1.2px 1.2px at 63% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 22% 38%,#fff,transparent),radial-gradient(1.3px 1.3px at 91% 52%,#fff,transparent)}
@keyframes twk{0%,100%{opacity:.55}50%{opacity:1}}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 38%,rgba(0,0,0,.55) 100%)}
#heroineWrap{position:absolute;left:0;bottom:0;height:78vh;display:flex;align-items:flex-end;justify-content:flex-start;pointer-events:none;transition:opacity .5s}
#heroine{max-height:78vh;max-width:46vw;object-fit:contain;-webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent 100%);mask-image:linear-gradient(to bottom,#000 82%,transparent 100%);filter:drop-shadow(0 14px 34px rgba(0,0,0,.75));animation:floaty 6.5s ease-in-out infinite}
#spriteWrap{position:absolute;right:0;bottom:0;height:74vh;display:flex;align-items:flex-end;justify-content:flex-end;pointer-events:none;transition:opacity .5s}
#sprite{max-height:74vh;max-width:44vw;object-fit:contain;-webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent 100%);mask-image:linear-gradient(to bottom,#000 82%,transparent 100%);filter:drop-shadow(0 14px 30px rgba(0,0,0,.7));animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(max-width:560px){#heroine{max-width:52vw}#heroineWrap{height:66vh}#sprite{max-width:44vw}#spriteWrap{height:62vh}}
#hud{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:20}
#chapterTag{font-size:10.5px;letter-spacing:.42em;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:0;padding:7px 14px 7px 18px;backdrop-filter:blur(3px)}
.affBox{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.affTop{font-size:10.5px;letter-spacing:.34em;color:#fff;text-shadow:0 0 12px rgba(0,0,0,.9)}
#affBar{width:108px;height:1px;background:rgba(255,255,255,.25);overflow:hidden}
#affFill{height:100%;width:0%;background:#fff;transition:width .8s cubic-bezier(.2,.9,.25,1)}
#menuBar{display:flex;gap:8px;pointer-events:auto}
#menuBar button{font-size:10.5px;letter-spacing:.24em;color:#fff;text-indent:.24em;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.34);border-radius:0;padding:7px 13px;cursor:pointer;transition:.3s;backdrop-filter:blur(4px)}
#menuBar button:active{background:rgba(255,255,255,.24)}
#affPop{position:absolute;top:82px;right:22px;font-size:17px;font-weight:400;letter-spacing:.16em;opacity:0;pointer-events:none;transition:.5s;color:#fff;text-shadow:0 0 16px rgba(0,0,0,.9);z-index:30}
#affPop.show{opacity:1;transform:translateY(-14px)}
#dialogBox{position:absolute;left:4%;right:4%;bottom:3.5%;min-height:23vh;padding:34px 34px 32px;border-radius:0;z-index:25;cursor:pointer;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.72));border:0;border-top:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.1);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);opacity:0;transition:opacity .4s}
#dialogBox.on{opacity:1}
#dialogBox.narr{background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.62))}
#speaker{position:absolute;top:-11px;left:34px;padding:0 16px;font-size:12px;font-weight:400;letter-spacing:.42em;color:#fff;background:#000;display:none;text-indent:.42em}
#speaker::before{content:"";position:absolute;left:16px;bottom:7px;width:calc(100% - 32px);height:1px;background:rgba(255,255,255,.35)}
#text{font-size:clamp(15px,4.1vw,18px);line-height:2.15;letter-spacing:.09em;white-space:pre-wrap;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.85)}
#nextInd{position:absolute;right:30px;bottom:14px;font-size:10px;letter-spacing:.3em;color:rgba(255,255,255,.75);opacity:0;animation:blink 1.6s infinite}
#choices{position:absolute;left:0;right:0;bottom:32vh;display:none;flex-direction:column;align-items:center;gap:14px;z-index:40;padding:0 18px}
.choice{width:min(580px,90vw);padding:17px 26px;text-align:left;font-size:clamp(13.5px,3.7vw,15.5px);letter-spacing:.1em;line-height:1.7;color:#fff;cursor:pointer;border-radius:0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.38);backdrop-filter:blur(8px);transition:.32s}
.choice:active{background:rgba(255,255,255,.24);border-color:#fff;letter-spacing:.16em}
#chapterCard{position:absolute;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:70;text-align:center;padding:0 24px}
#chapterCard.on{display:flex;animation:fadeIn 1s}
#ccTitle{font-size:clamp(26px,7.4vw,44px);font-weight:400;letter-spacing:.46em;color:#fff;text-indent:.46em;text-shadow:0 0 40px rgba(255,255,255,.3)}
#ccSub{margin-top:22px;font-size:clamp(10px,3.2vw,12px);letter-spacing:.5em;color:rgba(255,255,255,.45);text-indent:.5em}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:90;padding:14px 30px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.35);font-size:12px;letter-spacing:.34em;color:#fff;text-indent:.34em;opacity:0;pointer-events:none;transition:.35s;backdrop-filter:blur(6px)}
#toast.on{opacity:1}
#endScreen{background:#000;padding:0 26px;text-align:center}
#endKind{font-size:10.5px;letter-spacing:.75em;color:rgba(255,255,255,.55);text-indent:.75em}
#endTitle{margin:20px 0 30px;font-size:clamp(23px,6.6vw,38px);font-weight:400;letter-spacing:.3em;color:#fff;text-indent:.3em;text-shadow:0 0 40px rgba(255,255,255,.3)}
#endText{width:min(600px,92vw);font-size:clamp(13.5px,3.9vw,16px);line-height:2.25;color:#fff;letter-spacing:.09em;white-space:pre-wrap;text-align:left}
#endScore{margin-top:30px;font-size:11px;letter-spacing:.36em;color:rgba(255,255,255,.45);text-indent:.36em}
#endBtns{margin-top:38px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#endBtns button{padding:14px 32px;font-size:12px;letter-spacing:.34em;text-indent:.34em;border-radius:0;color:#fff;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.4);transition:.32s}
#endBtns button:active{background:rgba(255,255,255,.24)}
</style>
</head>
<body>
<div id="titleScreen" class="screen on">
  <div id="startBtn">开始攻略</div>
  <div class="tip">点 击 开 始</div>
  <button id="continueBtn" style="display:none">继 续 攻 略</button>
</div>
<div id="nameScreen" class="screen">
  <div class="panel">
    <h2>你 的 名 字</h2>
    <p>请输入男主角的名字</p>
    <input id="nameInput" maxlength="8" value="悠真" placeholder="悠真">
    <button id="okBtn">确 定</button>
  </div>
</div>
<div id="gameScreen">
  <div id="bg" class="bg-day"></div>
  <div id="bgFx"></div>
  <div id="vig"></div>
  <div id="heroineWrap"><img id="heroine" src="images/heroine.png" alt=""></div>
  <div id="spriteWrap"><img id="sprite" src="images/protagonist.png" alt=""></div>
  <div id="hud">
    <div id="chapterTag">序章</div>
    <div class="affBox">
      <div class="affTop">好 感 度 <span id="affNum">0</span></div>
      <div id="affBar"><div id="affFill"></div></div>
      <div id="menuBar">
        <button id="btnSave">存档</button>
        <button id="btnLoad">读档</button>
        <button id="btnTitle">标题</button>
      </div>
    </div>
  </div>
  <div id="affPop"></div>
  <div id="dialogBox">
    <div id="speaker"></div>
    <div id="text"></div>
    <div id="nextInd">点 击 继 续</div>
  </div>
  <div id="choices"></div>
  <div id="chapterCard">
    <div id="ccTitle"></div>
    <div id="ccSub"></div>
  </div>
  <div id="toast"></div>
</div>
<div id="endScreen" class="screen">
  <div id="endKind">TRUE END</div>
  <div id="endTitle"></div>
  <div id="endText"></div>
  <div id="endScore"></div>
  <div id="endBtns">
    <button id="btnAgain">重 新 攻 略</button>
    <button id="btnBackTitle">回 到 标 题</button>
  </div>
</div>
<script src="story.js"></script>
<script src="game.js"></script>
</body>
</html>
